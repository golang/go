name: Publish shared toolchain release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create
        required: true
        default: shared-toolchain-v0.1.0
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download successful platform packages for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          download_package() {
            local workflow="$1"
            local artifact="$2"
            local run_id
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" --json databaseId,conclusion,headSha --jq 'map(select(.conclusion == "success" and .headSha == env.GITHUB_SHA)) | .[0].databaseId // empty')"
            if [[ -z "$run_id" ]]; then
              echo "No successful $workflow run exists for $GITHUB_SHA" >&2
              return 1
            fi
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir release-assets
          }

          download_package shared-windows-amd64.yml go-shared-windows-amd64
          download_package shared-linux-amd64.yml go-shared-linux-amd64

          test -s release-assets/go-shared-windows-amd64.zip
          test -s release-assets/go-shared-linux-amd64.tar.gz
          unzip -tq release-assets/go-shared-windows-amd64.zip
          tar -tzf release-assets/go-shared-linux-amd64.tar.gz >/dev/null
          sha256sum release-assets/go-shared-windows-amd64.zip release-assets/go-shared-linux-amd64.tar.gz > release-assets/SHA256SUMS

      - name: Create GitHub release with platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists" >&2
            exit 1
          fi
          notes="$(mktemp)"
          printf 'Self-contained Go shared-toolchain packages built and tested from commit %s.\n\nIncludes Windows amd64 and Linux amd64 archives. See the repository README for build details and limitations.\n' "$GITHUB_SHA" > "$notes"
          gh release create "$TAG_NAME" \
            release-assets/go-shared-windows-amd64.zip \
            release-assets/go-shared-linux-amd64.tar.gz \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Go shared toolchain $TAG_NAME" \
            --notes-file "$notes"
