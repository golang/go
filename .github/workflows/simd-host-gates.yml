name: "SIMD host fixture gates"

"on":
  pull_request:
    paths:
      - ".github/workflows/simd-host-gates.yml"
      - "src/cmd/go/scriptconds_test.go"
      - "src/cmd/go/internal/logos/config/targetcpu*"
      - "src/cmd/go/testdata/script/logos_simd_feature_gate.txt"
      - "src/cmd/go/testdata/script/logos_simd_gate_avx512.txt"
      - "src/cmd/go/testdata/script/logos_simd_gate_branch.txt"
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "simd-host-gates-${{ github.ref }}"
  cancel-in-progress: true

env:
  GOMAXPROCS: "4"
  GOFLAGS: "-p=2"
  GOMEMLIMIT: "2GiB"

jobs:
  scripts:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 60
    defaults:
      run:
        shell: "bash"
        working-directory: "src"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: "Build the default toolchain"
        run: |
          GOROOT_BOOTSTRAP=$(go env GOROOT)
          export GOROOT_BOOTSTRAP
          GOEXPERIMENT="" ./make.bash
          printf '%s\n' "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: "Check formatting and vet"
        run: |
          gofmt -d cmd/go/scriptconds_test.go
          test -z "$(gofmt -l cmd/go/scriptconds_test.go)"
          go vet cmd/go
      - name: "Run host-ISA fixture gates under the race detector"
        env:
          GOAMD64: "v1"
          GOEXPERIMENT: ""
        run: |
          go test -count=1 -race -timeout=30m -v cmd/go -run '^TestScript$/^(README|logos_simd_(feature_gate|gate_avx512|gate_branch))$'
