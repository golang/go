!sum
- go: And
  asm: "VAND"
  in:
  - &any
    go: $t
  - *any
  out:
  - *any
- go: Or
  asm: "VORR"
  in:
  - *any
  - *any
  out:
  - *any
- go: Xor
  asm: "VEOR"
  in:
  - *any
  - *any
  out:
  - *any
- go: AndNot
  asm: "VBIC"
  in:
  - *any
  - *any
  out:
  - *any
# orNot is internal. It defines the VORN machine op, which the peephole rule
# folds x.Or(y.Not()) into. VORN treats the register as a bag of bits, so
# Uint8x16 is enough.
- go: orNot
  asm: "VORN"
  peepholeRules:
  - !string "(VORR16B x (VNOT16B y)) => (%h x y)"
  in:
  - &v8
    go: $t
    class: vreg
    base: uint
    elemBits: 8
  - *v8
  out:
  - *v8
- go: Not
  asm: "VNOT"
  in:
  - *any
  out:
  - *any
