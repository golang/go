!sum
- go: And
  commutative: true
  documentation: !string |-
    // NAME performs a bitwise x & y.
# AVX1/2 have different AND operations for integer (VPAND) and floating-point
# (VANDP[SD]) vectors; andFloat generates the VANDP[SD] machine ops for
# MaskedFloat32/64 lowering.
- go: andFloat
  commutative: true
  noTypes: "true"
  noGenericOps: "true"
  documentation: !string |-
    // NAME performs a bitwise x & y for floating-point values.
- go: Or
  commutative: true
  documentation: !string |-
    // NAME performs a bitwise x | y.
- go: AndNot
  commutative: false
  documentation: !string |-
    // NAME performs a bitwise x &^ y.
- go: Xor
  commutative: true
  documentation: !string |-
    // NAME performs a bitwise x ^ y.
- go: orNot
  commutative: false
  documentation: !string |-
    // NAME performs a bitwise x | ^y.
- go: Not
  commutative: false
  documentation: !string |-
    // NAME returns the bitwise complement of x.
- go: tern
  commutative: false
  documentation: !string |-
    // NAME performs a logical operation on three vectors based on the 8-bit truth table.
    // Bitwise, the result is equal to 1 & (table >> (x<<2 + y<<1 + z))

# We also have PTEST and VPTERNLOG, those should be hidden from the users
# and only appear in rewrite rules.
