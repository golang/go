!sum
- go: Average
  commutative: true
  documentation: !string |-
    // NAME computes the rounded average of corresponding elements.
- go: Abs
  commutative: false
  # Unary operation, not commutative
  documentation: !string |-
    // NAME computes the absolute value of each element.
- go: MulSign
  commutative: false
  documentation: !string |-
    // NAME returns the product of x with the sign of y (-1, 0, or 1).
- go: OnesCount
  commutative: false
  documentation: !string |-
    // NAME counts the number of set bits in each element.
- go: onesCount # amd64 emulates on AVX and AVX2, access AVX512 through feature check
  commutative: false
  documentation: !string |-
    // NAME counts the number of set bits in each element.
# Constrained to integer elements: the float Div in FPonlyArith documents the
# IEEE 754 semantics.
- go: Div
  commutative: false
  out:
  - base: int|uint
  documentation: !string |-
    // NAME divides corresponding elements of two vectors, truncating toward
    // zero. Division by zero yields zero rather than panicking, and dividing
    // the minimum signed value by -1 yields the minimum signed value.
