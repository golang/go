- go: ConcatPermute128Scalars
  asm: VPERM2F128
  operandOrder: II
  addDoc: !string |-
    // For example,
    //
    //   {40, 41, 50, 51}.NAME(3, 0, {60, 61, 70, 71})
    //
    // returns {70, 71, 40, 41}.
  in:
  - class: immediate
    immOffset: 0
    name: "lo, hi"
  - &v
    go: $t
    class: vreg
    base: float
    bits: 256
  - *v
  inVariant: []
  out:
  - *v

