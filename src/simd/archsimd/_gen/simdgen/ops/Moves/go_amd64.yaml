    immOffset: 0
    immMax: 1
    name: index
  - &t
    class: vreg
    base: $b
  - class: greg
    base: $b
    lanes: 1 # Scalar, darn it!
  out:
  - *t

- go: SetElem
  asm: "VPINSRD"
  in:
