- go: GetElem # VPEXTRB 128 bit
  asm: VPEXTRB
  in:
  - class: immediate
    immOffset: 0
    immMax: 15
    name: index
  - bits: 128
    base: $b
    class: vreg
    elemBits: 8
  out:
    - bits: 32
      base: $b
      class: greg
      overwriteBits: 8 # The XED data specification is wrong, correct it to the right bits

- go: GetElem # VPEXTRW 128 bit
  asm: VPEXTRW
  in:
  - class: immediate
    immOffset: 0
    immMax: 7
    name: index
  - bits: 128
    base: $b
    class: vreg
    elemBits: 16
  out:
    - bits: 32
      base: $b
      class: greg
      overwriteBits: 16 # The XED data specification is wrong, correct it to the right bits

