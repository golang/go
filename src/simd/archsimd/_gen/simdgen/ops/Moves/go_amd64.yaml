# VPSHUFB for 128-bit byte shuffles will be picked with higher priority than VPERMB, given its lower CPU feature requirement. (It's AVX)
- go: PermuteOrZero
  asm: VPSHUFB
  in:
  - &128any
    bits: 128
    go: $t
  - bits: 128
    name: indices
    base: int # always signed
  out:
  - *128any

- go: PermuteOrZeroGrouped
  asm: VPSHUFB
  in:
  - &256Or512any
    bits: "256|512"
    go: $t
  - bits: "256|512"
    base: int
    name: indices
  out:
  - *256Or512any

- go: permuteScalars
  asm: VPSHUFD
  addDoc: !string |-
    //
    //   result = {x[indices[0:2]], x[indices[2:4]], x[indices[4:6]], x[indices[6:8]]}
    //
    // Indices is four 2-bit values packed into a byte, thus indices[0:2] is the first index.
  in:
  - class: immediate
    immOffset: 0
    name: indices
  - *128any
  hideMaskMethods: true
  out:
  - *128any

- go: permuteScalarsGrouped
  asm: VPSHUFD
  addDoc: !string |-
    //
    //   result = {x_group0[indices[0:2]], x_group0[indices[2:4]], x_group0[indices[4:6]], x_group0[indices[6:8]], x_group1[indices[0:2]], ...}
    //
    // Indices is four 2-bit values packed into a byte, thus indices[0:2] is the first index.
    // Each group is of size 128-bit.
  in:
  - class: immediate
    immOffset: 0
    name: indices
  - *256Or512any
  hideMaskMethods: true
  out:
  - *256Or512any

- go: permuteScalarsLo # For AVX
  asm: VPSHUFLW
  addDoc: !string |-
    //
    //   result = {x[indices[0:2]], x[indices[2:4]], x[indices[4:6]], x[indices[6:8]], x[4], x[5], x[6], x[7]}
    //
    // Indices is four 2-bit values packed into a byte, thus indices[0:2] is the first index.
  in:
  - class: immediate
    immOffset: 0
    name: indices
  - &32x4To16x8
    bits: 128
    go: $t
    elemBits: 32
    OverwriteElementBits: 16 # XED data incorrectly specified this as 32-bit, we need to fix it.
  hideMaskMethods: true
  out:
  - *32x4To16x8

- go: permuteScalarsLo
  asm: VPSHUFLW
  addDoc: !string |-
    //
    //   result = {x[indices[0:2]], x[indices[2:4]], x[indices[4:6]], x[indices[6:8]], x[4], x[5], x[6], x[7]}
    //
    // Indices is four 2-bit values packed into a byte, thus indices[0:2] is the first index.
  in:
    - class: immediate
      immOffset: 0
      name: indices
    - &128lanes8
      bits: 128
      go: $t
      elemBits: 16
  hideMaskMethods: true
  out:
    - *128lanes8

- go: permuteScalarsLoGrouped
  asm: VPSHUFLW
  addDoc: !string |-
    //
    //   result = {x_group0[indices[0:2]], x_group0[indices[2:4]], x_group0[indices[4:6]], x_group0[indices[6:8]], x[4], x[5], x[6], x[7],
    //    x_group1[indices[0:2]], ...}
    //
    // Indices is four 2-bit values packed into a byte, thus indices[0:2] is the first index.
    // Each group is of size 128-bit.
  in:
  - class: immediate
    immOffset: 0
    name: indices
  - &256Or512lanes8
    bits: "256|512"
    go: $t
    elemBits: 16
  hideMaskMethods: true
  out:
  - *256Or512lanes8

- go: permuteScalarsHi
  asm: VPSHUFHW
  addDoc: !string |-
    //
    //   result = {x[0], x[1], x[2], x[3], x[indices[0:2]+4], x[indices[2:4]+4], x[indices[4:6]+4], x[indices[6:8]+4]}
    //
    // Indices is four 2-bit values packed into a byte, thus indices[0:2] is the first index.
  in:
  - class: immediate
    immOffset: 0
    name: indices
  - *128lanes8
  hideMaskMethods: true
  out:
  - *128lanes8

- go: permuteScalarsHi # For AVX
  asm: VPSHUFHW
  addDoc: !string |-
    //
    //   result = {x[0], x[1], x[2], x[3], x[indices[0:2]+4], x[indices[2:4]+4], x[indices[4:6]+4], x[indices[6:8]+4]}
    //
    // Indices is four 2-bit values packed into a byte, thus indices[0:2] is the first index.
  in:
  - class: immediate
    immOffset: 0
    name: indices
  - &32x4To16x8
    bits: 128
    go: $t
    elemBits: 32
    OverwriteElementBits: 16 # XED data incorrectly specified this as 32-bit, we need to fix it.
  hideMaskMethods: true
  out:
  - *32x4To16x8

- go: permuteScalarsHiGrouped
  asm: VPSHUFHW
  addDoc: !string |-
    // result =
    //
    //   {x_group0[0], x_group0[1], x_group0[2], x_group0[3], x_group0[indices[0:2]+4], x_group0[indices[2:4]+4], x_group0[indices[4:6]+4], x_group0[indices[6:8]+4],
    //    x_group1[0], x_group1[1], x_group1[2], x_group1[3], x_group1[indices[0:2]+4], ...}
    //
    // Indices is four 2-bit values packed into a byte, thus indices[0:2] is the first index.
    // Each group is of size 128-bit.
  in:
  - class: immediate
    immOffset: 0
    name: indices
  - *256Or512lanes8
  hideMaskMethods: true
  out:
  - *256Or512lanes8

- go: InterleaveHi
  asm: VPUNPCKH(QDQ|DQ|WD|BW)
  in:
  - *128any
  - *128any
