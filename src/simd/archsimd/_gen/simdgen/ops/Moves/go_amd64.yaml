    immOffset: 0
    immMax: 7
    name: index
  - &t
    class: vreg
    base: $b
  - class: greg
    base: $b
    lanes: 1 # Scalar, darn it!
  out:
  - *t
- go: SetElem
  asm: "VPINSRD"
  in:
