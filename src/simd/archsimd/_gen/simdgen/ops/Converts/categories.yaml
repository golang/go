!sum
# Float <-> Int conversions
- go: "ConvertToInt32"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to int32.
    // When a conversion is inexact, a truncated (round toward zero) value is returned.
    // If a converted result cannot be represented in int32, an implementation-defined
    // architecture-specific value is returned.
- go: "ConvertToUint32"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to uint32.
    // When a conversion is inexact, a truncated (round toward zero) value is returned.
    // If a converted result cannot be represented in uint32, an implementation-defined
    // architecture-specific value is returned.
- go: "ConvertToInt64"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to int64.
    // When a conversion is inexact, a truncated (round toward zero) value is returned.
    // If a converted result cannot be represented in int64, an implementation-defined
    // architecture-specific value is returned.
- go: "ConvertToUint64"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to uint64.
    // When a conversion is inexact, a truncated (round toward zero) value is returned.
    // If a converted result cannot be represented in uint64, an implementation-defined
    // architecture-specific value is returned.
- go: "ConvertToFloat32" # Also float64 -> float32
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to float32.
- go: "ConvertToFloat64" # Also float32 -> float64
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to float64.

# Int <-> Int conversions
- go: "TruncToInt8"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME truncates element values to int8.
- go: "SaturateToInt8"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to int8 with signed saturation.
- go: "concatSaturateToInt8(Grouped)?"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts the element values of x and y to int8 with signed
    // saturation and packs them into the low and high halves of the result
    // (of each 128-bit group, for Grouped).
- go: "ExtendToInt16(Concat)?"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME sign-extends element values to int16.
- go: "TruncToInt16(Concat)?"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME truncates element values to int16.
- go: "(Concat)?SaturateToInt16(Grouped)?"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to int16 with signed saturation.
- go: "ExtendToInt32"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME sign-extends element values to int32.
- go: "TruncToInt32"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME truncates element values to int32.
- go: "SaturateToInt32"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to int32 with signed saturation.
- go: "ExtendToInt64"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME sign-extends element values to int64.
- go: "TruncToUint8"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME truncates element values to uint8.
- go: "SaturateToUint8"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to uint8 with unsigned saturation.
- go: "concatSaturateToUint8(Grouped)?"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts the signed element values of x and y to uint8 with
    // saturation and packs them into the low and high halves of the result
    // (of each 128-bit group, for Grouped).
- go: "ExtendToUint16(Concat)?"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME zero-extends element values to uint16.
- go: "TruncToUint16(Concat)?"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME truncates element values to uint16.
- go: "(Concat)?SaturateToUint16(Grouped)?"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values to uint16 with unsigned saturation.
- go: "ExtendToUint32"
  regexpTag: "convert"
  commutative: false
  documentation: !string |-
    // NAME zero-extends element values to uint32.
- go: "TruncToUint32"
  regexpTag: "convert"
  commutative: false
  documentation: !string |-
    // NAME truncates element values to uint32.
- go: "SaturateToUint32"
  regexpTag: "convert"
  commutative: false
  documentation: !string |-
    // NAME converts element values to uint32 with unsigned saturation.
- go: "ExtendToUint64"
  regexpTag: "convert"
  commutative: false
  documentation: !string |-
    // NAME zero-extends element values to uint64.
# Internal 2:1 narrowing conversions, used under a feature check.
- go: "truncToUint(8|16|32)"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME truncates element values, storing the results in the low half of
    // the result and zeroing the rest.
- go: "saturateTo(Int|Uint)(8|16|32)"
  commutative: false
  regexpTag: "convert"
  documentation: !string |-
    // NAME converts element values with saturation, storing the results in
    // the low half of the result and zeroing the rest.
