  asm: "VPMOVQW"
  in:
  - base: uint
    bits: $b
  out:
  - base: uint
    goBits: $b
# uint32 -> uint16, truncating, 512-bit only
- go: TruncToUint16
  regexpTag: "convert"
  asm: "VPMOVDW"
  in:
  - base: uint
    bits: 512
  out:
  - base: uint
    goBits: 512
# uint64 -> uint32, truncating, 512-bit only
- go: TruncToUint32
  regexpTag: "convert"
  asm: "VPMOVQD"
  in:
  - base: uint
    bits: 512
  out:
  - base: uint
    goBits: 512
# int32|int64 -> int8, saturating
- go: SaturateToInt8
  regexpTag: "convert"
  asm: "VPMOVS[DQ]B"
  in:
  - base: int
    bits: $b
