!sum
# Conversions that change the element size keep the vector width the same.
#
# A narrowing conversion stores its results in the low elements of the result,
# and the instruction zeroes the rest. When the results don't fill a whole
# register, the instruction writes a narrower register than the result's Go
# type, so the result takes its Go width from the input with goBits.
#
# A widening conversion reads only the low elements of its input. The
# instruction reads a narrower register than the input's Go type, so the input
# takes its Go width from the result with goBits.

# Same-size float <-> int conversions
# float32 -> int32
- go: ConvertToInt32
  regexpTag: "convert"
  asm: "VCVTTPS2DQ"
  in:
  - &fp
    go: $t
    base: float
  out:
  - go: $u
    base: int
    elemBits: 32
# float32 -> uint32
- go: ConvertToUint32
  regexpTag: "convert"
  asm: "VCVTTPS2UDQ"
  in:
  - *fp
  out:
  - go: $u
    base: uint
    elemBits: 32
# float64 -> int64
- go: ConvertToInt64
  regexpTag: "convert"
  asm: "VCVTTPD2QQ"
  in:
  - *fp
  out:
  - go: $u
    base: int
    elemBits: 64
# float64 -> uint64
- go: ConvertToUint64
  regexpTag: "convert"
  asm: "VCVTTPD2UQQ"
  in:
  - *fp
  out:
  - go: $u
    base: uint
    elemBits: 64
# int32 -> float32
- go: ConvertToFloat32
  regexpTag: "convert"
  asm: "VCVTDQ2PS"
  in:
  - go: $i
    base: int
  out:
  - *fp
# int64 -> float64
- go: ConvertToFloat64
  regexpTag: "convert"
  asm: "VCVTQQ2PD"
  in:
  - go: $i
    base: int
  out:
  - *fp
# uint32 -> float32
- go: ConvertToFloat32
  regexpTag: "convert"
  asm: "VCVTUDQ2PS"
  in:
  - go: $u
    base: uint
  out:
  - *fp
# uint64 -> float64
- go: ConvertToFloat64
  regexpTag: "convert"
  asm: "VCVTUQQ2PD"
  in:
  - go: $u
    base: uint
  out:
  - *fp

# Narrowing float <-> int and float <-> float conversions
# float64 -> int32
- go: ConvertToInt32
  regexpTag: "convert"
  asm: "VCVTTPD2DQ"
  in:
  - base: float
    elemBits: 64
    bits: $b
  out:
  - base: int
    elemBits: 32
    goBits: $b
# float64 -> uint32
- go: ConvertToUint32
  regexpTag: "convert"
  asm: "VCVTTPD2UDQ"
  in:
  - base: float
    elemBits: 64
    bits: $b
  out:
  - base: uint
    elemBits: 32
    goBits: $b
# int64 -> float32
- go: ConvertToFloat32
  regexpTag: "convert"
  asm: "VCVTQQ2PS"
  in:
  - base: int
    elemBits: 64
    bits: $b
  out:
  - base: float
    elemBits: 32
    goBits: $b
