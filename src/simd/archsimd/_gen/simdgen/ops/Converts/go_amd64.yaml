# 2:1 narrowing conversions on 128- and 256-bit vectors, which
# converts_emulated_amd64.go uses in place of its emulations when AVX-512 is
# available. Constraining the result register to 64 or 128 bits excludes the
# 512-bit forms, which are exported above.
- go: truncToUint8
  regexpTag: "convert"
  asm: "VPMOVWB"
  in:
  - base: uint
    bits: $b
  out:
  - base: uint
    bits: 64|128
    goBits: $b
- go: truncToUint16
  regexpTag: "convert"
  asm: "VPMOVDW"
