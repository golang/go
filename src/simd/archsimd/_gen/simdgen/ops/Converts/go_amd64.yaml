# Narrowing integer conversions
#
# The 2:1 forms are only for 512-bit vectors. The 128- and 256-bit 2:1 forms
# are emulated in converts_emulated_amd64.go using AVX and AVX2 instructions,
# so they're available everywhere their vector size is.

# int32|int64 -> int8, truncating
- go: TruncToInt8
  regexpTag: "convert"
  asm: "VPMOV[DQ]B"
  in:
  - base: int
    bits: $b
  out:
  - base: int
    goBits: $b
# int16 -> int8, truncating, 512-bit only
- go: TruncToInt8
  regexpTag: "convert"
  asm: "VPMOVWB"
  in:
  - base: int
    bits: 512
  out:
  - base: int
    goBits: 512
# int64 -> int16, truncating
- go: TruncToInt16
  regexpTag: "convert"
  asm: "VPMOVQW"
  in:
  - base: int
    bits: $b
  out:
  - base: int
    goBits: $b
# int32 -> int16, truncating, 512-bit only
- go: TruncToInt16
  regexpTag: "convert"
  asm: "VPMOVDW"
  in:
  - base: int
    bits: 512
  out:
  - base: int
    goBits: 512
# int64 -> int32, truncating, 512-bit only
- go: TruncToInt32
  regexpTag: "convert"
  asm: "VPMOVQD"
  in:
  - base: int
    bits: 512
  out:
  - base: int
    goBits: 512
# uint32|uint64 -> uint8, truncating
- go: TruncToUint8
  regexpTag: "convert"
