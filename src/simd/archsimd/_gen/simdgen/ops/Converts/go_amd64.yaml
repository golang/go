# Truncating saturated packed
- go: ConcatSaturateToInt16
  regexpTag: "convert"
  asm: "VPACKSSDW"
  addDoc: &satDocConcat
    !string |-
    // The converted elements from x will be packed to the lower part of the result vector,
    // the converted elements from y will be packed to the upper part of the result vector.
  in:
    - base: int
    - base: int
  out:
    - base: int
      bits: 128
- go: ConcatSaturateToInt16Grouped
  regexpTag: "convert"
  asm: "VPACKSSDW"
  addDoc: &satDocConcatGrouped
    !string |-
    // With each 128-bit as a group:
    // The converted elements from x will be packed to the lower part of the group in the result vector,
    // the converted elements from y will be packed to the upper part of the group in the result vector.
  in:
    - base: int
    - base: int
  out:
    - base: int
      bits: 256|512
- go: ConcatSaturateToUint16
  regexpTag: "convert"
  asm: "VPACKUSDW"
  addDoc: *satDocConcat
  in:
    - base: int
    - base: int
  out:
    - base: uint
      bits: 128
- go: ConcatSaturateToUint16Grouped
  regexpTag: "convert"
  asm: "VPACKUSDW"
  addDoc: *satDocConcatGrouped
  in:
    - base: int
    - base: int
  out:
    - base: uint
      bits: 256|512

