# Low-part conversions from a 128-bit vector to a wider vector. These are
# deprecated in favor of x.Enlarge().ExtendTo*(), but remain because each is a
# single instruction. The 128-bit to
# 128-bit ExtendLo forms are deprecated wrappers around ExtendTo in
# deprecated_amd64.go.
- go: ExtendLo4ToUint64
  regexpTag: "convert"
  asm: "VPMOVZXWQ"
  addDoc: !string |-
    //
    // Deprecated: use x.Enlarge().ExtendToUint64() instead.
  in:
  - base: uint
    elemBits: 16
    bits: 128
  out:
  - base: uint
    elemBits: 64
    bits: 256
