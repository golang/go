!sum
# Sqrt — floating-point square root, ZFSQRT. Predicated-only: the governing
# predicate is implicit-all-true and the merging qualifier becomes the
# predicated machine op.
- go: Sqrt
  asm: "ZFSQRT"
  in:
  - &float
    go: $t
    base: float
  - class: mask # governing predicate
  out:
  - *float

# Ceil — floating-point round (ZFRINTP). Predicated-only, same shape as Sqrt.
- go: Ceil
  asm: "ZFRINTP"
  in:
  - *float
  - class: mask # governing predicate
  out:
  - *float

# Floor — floating-point round (ZFRINTM). Predicated-only, same shape as Sqrt.
- go: Floor
  asm: "ZFRINTM"
  in:
  - *float
  - class: mask # governing predicate
  out:
  - *float
