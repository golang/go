!sum
# Greater — signed integer compare. ZCMPGT is predicated-only: there is no
# unpredicated variant, so its first operand is a governing predicate.
- go: Greater
  asm: "ZCMPGT"
  in:
  - &int
    go: $t
    base: int
  - *int
  - class: mask # governing predicate
  out:
  - class: mask

# Greater — unsigned integer compare, ZCMPHI ("higher").
- go: Greater
  asm: "ZCMPHI"
  in:
  - &uint
    go: $t
    base: uint
  - *uint
  - class: mask # governing predicate
  out:
  - class: mask

# Greater — floating-point compare, ZFCMGT.
- go: Greater
  asm: "ZFCMGT"
  in:
  - &float
    go: $t
    base: float
  - *float
  - class: mask # governing predicate
  out:
  - class: mask

# Equal — integer compare, ZCMPEQ (sign-agnostic, both signednesses).
- go: Equal
  asm: "ZCMPEQ"
  in:
  - *int
  - *int
  - class: mask # governing predicate
  out:
  - class: mask

- go: Equal
  asm: "ZCMPEQ"
  in:
  - *uint
  - *uint
  - class: mask # governing predicate
  out:
  - class: mask

# Equal — floating-point compare, ZFCMEQ.
- go: Equal
  asm: "ZFCMEQ"
  in:
  - *float
  - *float
  - class: mask # governing predicate
  out:
  - class: mask
