!sum
# Greater — signed integer compare. ZCMPGT is predicated-only: there is no
# unpredicated variant, so its first operand is a governing predicate.
- go: Greater
  asm: "ZCMPGT"
  in:
  - &int
    go: $t
    base: int
  - *int
  - class: mask # governing predicate
  out:
  - class: mask

# Greater — unsigned integer compare, ZCMPHI ("higher").
- go: Greater
  asm: "ZCMPHI"
  in:
  - &uint
    go: $t
    base: uint
  - *uint
  - class: mask # governing predicate
  out:
  - class: mask

# Greater — floating-point compare, ZFCMGT.
- go: Greater
  asm: "ZFCMGT"
  in:
  - &float
    go: $t
    base: float
  - *float
  - class: mask # governing predicate
  out:
  - class: mask

# Equal — integer compare, ZCMPEQ (sign-agnostic, both signednesses).
- go: Equal
  asm: "ZCMPEQ"
  in:
  - *int
  - *int
  - class: mask # governing predicate
  out:
  - class: mask

- go: Equal
  asm: "ZCMPEQ"
  in:
  - *uint
  - *uint
  - class: mask # governing predicate
  out:
  - class: mask

# Equal — floating-point compare, ZFCMEQ.
- go: Equal
  asm: "ZFCMEQ"
  in:
  - *float
  - *float
  - class: mask # governing predicate
  out:
  - class: mask

# NotEqual — integer compare, ZCMPNE (sign-agnostic, both signednesses).
- go: NotEqual
  asm: "ZCMPNE"
  in:
  - *int
  - *int
  - class: mask # governing predicate
  out:
  - class: mask

- go: NotEqual
  asm: "ZCMPNE"
  in:
  - *uint
  - *uint
  - class: mask # governing predicate
  out:
  - class: mask

# NotEqual — floating-point compare, ZFCMNE.
- go: NotEqual
  asm: "ZFCMNE"
  in:
  - *float
  - *float
  - class: mask # governing predicate
  out:
  - class: mask

# GreaterEqual — signed integer compare, ZCMPGE.
- go: GreaterEqual
  asm: "ZCMPGE"
  in:
  - *int
  - *int
  - class: mask # governing predicate
  out:
  - class: mask

# GreaterEqual — unsigned integer compare, ZCMPHS ("higher or same").
- go: GreaterEqual
  asm: "ZCMPHS"
  in:
  - *uint
  - *uint
  - class: mask # governing predicate
  out:
  - class: mask

# GreaterEqual — floating-point compare, ZFCMGE.
- go: GreaterEqual
  asm: "ZFCMGE"
  in:
  - *float
  - *float
  - class: mask # governing predicate
  out:
  - class: mask
