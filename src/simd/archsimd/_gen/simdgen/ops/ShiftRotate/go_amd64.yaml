!sum
# Integers
# ShiftAll*
- go: ShiftAllLeft
  sftimm: true
  asm: "VPSLL[WDQ]"
  in:
  - &any
    go: $t
  - &vecAsScalar64
    go: "Uint.*"
    treatLikeAScalarOfSize: 64
    name: shift
  out:
  - *any
- go: ShiftAllRight
  signed: false
  sftimm: true
  asm: "VPSRL[WDQ]"
  in:
  - &uint
    go: $t
    base: uint
  - *vecAsScalar64
  out:
  - *uint
- go: ShiftAllRight
  signed: true
  sftimm: true
  asm: "VPSRA[WD]"
  in:
  - &int
    go: $t
    base: int
  - *vecAsScalar64
  out:
  - *int
# VPSRAW and VPSRAD are AVX at 128 bits and AVX2 at 256 bits, the feature
# levels midway requires of those widths, so ShiftAllRight on signed 16- and
# 32-bit elements uses them at every width. VPSRAQ, for 64-bit elements, needs
# AVX-512 at every width, so ShiftAllRight uses it only at 512 bits; at 128 and
# 256 bits it is emulated with AVX and AVX2 in ops_emulated_amd64.go, and
# AMD64.rules turns that emulation back into VPSRAQ (shiftAllRightInt64AVX512
# below) where AVX-512 is known to be available.
- go: ShiftAllRight
  signed: true
  sftimm: true
  asm: "VPSRAQ"
  in:
  - go: $t
    base: int
    bits: 512
  - *vecAsScalar64
  out:
  - go: $t
    base: int
    bits: 512
- go: shiftAllRightInt64AVX512
  signed: true
  sftimm: true
  asm: "VPSRAQ"
  in:
  - go: $t
    base: int
    bits: (128|256)
  - *vecAsScalar64
  out:
  - go: $t
    base: int
    bits: (128|256)

- go: shiftAllLeftConst
  ssaVariant: "const" # to avoid its name colliding with reg version of this instruction, amend this to its ssa op name.
  nameAndSizeCheck: true
  asmRules:
  - !string "a==0 => x"
  asm: "VPSLL[WDQ]"
  in:
  - &imm
    class: immediate
    immOffset: 0
  - *any
  out:
  - *any
- go: shiftAllRightConst
  ssaVariant: "const" # to avoid its name colliding with reg version of this instruction, amend this to its ssa op name.
  nameAndSizeCheck: true
  asmRules:
  - !string "a==0 => x"
  asm: "VPSRA[WDQ]"
  in:
  - *imm
  - *int
  out:
  - *int
- go: shiftAllRightConst
  ssaVariant: "const" # to avoid its name colliding with reg version of this instruction, amend this to its ssa op name.
  nameAndSizeCheck: true
  asmRules:
  - !string "a==0 => x"
  asm: "VPSRL[WDQ]"
  in:
  - *imm
  - *uint
  out:
  - *uint

# Shift* (variable)
- go: ShiftLeft
  nameAndSizeCheck: true
  asm: "VPSLLV[WD]"
  in:
  - go: $t
  - go: $t
    overwriteBase: uint
    name: shift
  out:
  - go: $t
# XED data of VPSLLVQ marks the element bits 32 which is off to the actual semantic, we need to overwrite
# it to 64.
- go: ShiftLeft
  nameAndSizeCheck: true
  asm: "VPSLLVQ"
  in:
  - go: $t
    overwriteElementBits: 64
  - go: $t
    overwriteElementBits: 64
    overwriteBase: uint
    name: shift
  out:
  - go: $t
    overwriteElementBits: 64
- go: ShiftRight
  signed: false
  nameAndSizeCheck: true
  asm: "VPSRLV[WD]"
  in:
  - go: $t
    base: uint
  - go: $t
    overwriteBase: uint
    name: shift
  out:
  - go: $t
    base: uint
# XED data of VPSRLVQ needs the same overwrite as VPSLLVQ.
- go: ShiftRight
  signed: false
  nameAndSizeCheck: true
  asm: "VPSRLVQ"
  in:
  - go: $t
    base: uint
    overwriteElementBits: 64
  - go: $t
    overwriteElementBits: 64
    overwriteBase: uint
    name: shift
  out:
  - go: $t
    base: uint
    overwriteElementBits: 64
- go: ShiftRight
  signed: true
  nameAndSizeCheck: true
  asm: "VPSRAV[WDQ]"
  in:
  - go: $t
    base: int
  - go: $t
    overwriteBase: uint
    name: shift
  out:
  - go: $t
    base: int

# Rotate
- go: rotateAllLeft
  nameAndSizeCheck: true
  asm: "VPROL[DQ]"
  in:
  - &pureImm
    class: immediate
    immOffset: 0
    name: shift
  - *uint
  out:
  - *uint
- go: rotateAllRight
  nameAndSizeCheck: true
  asm: "VPROR[DQ]"
  in:
  - *pureImm
  - *uint
  out:
  - *uint
- go: RotateLeft
  nameAndSizeCheck: true
  asm: "VPROLV[DQ]"
  in:
  - *uint
  - base: uint
    name: shift
  out:
  - *uint
- go: RotateRight
  nameAndSizeCheck: true
  asm: "VPRORV[DQ]"
  in:
  - *uint
  - base: uint
    name: shift
  out:
  - *uint

# Bizzare shifts.
- go: ShiftAllLeftConcatMod16
  nameAndSizeCheck: true
  asm: "VPSHLDW"
  operandOrder: 2I
  in:
  - *pureImm
  - *any
  - *any
  out:
  - *any
- go: ShiftAllRightConcatMod16
  nameAndSizeCheck: true
  asm: "VPSHRDW"
  operandOrder: 2I
  in:
  - *pureImm
  - *any
  - *any
  out:
  - *any
- go: ShiftLeftConcatMod16
  nameAndSizeCheck: true
  asm: "VPSHLDVW"
  in:
  - go: $t
  - go: $t
  - base: uint
    name: shift
  out:
  - go: $t
- go: ShiftRightConcatMod16
  nameAndSizeCheck: true
  asm: "VPSHRDVW"
  in:
  - go: $t
  - go: $t
  - base: uint
    name: shift
  out:
  - go: $t
- go: ShiftAllLeftConcatMod32
  nameAndSizeCheck: true
  asm: "VPSHLDD"
  operandOrder: 2I
  in:
  - *pureImm
  - *any
  - *any
  out:
  - *any
- go: ShiftAllRightConcatMod32
  nameAndSizeCheck: true
  asm: "VPSHRDD"
  operandOrder: 2I
  in:
  - *pureImm
  - *any
  - *any
  out:
  - *any
- go: ShiftLeftConcatMod32
  nameAndSizeCheck: true
  asm: "VPSHLDVD"
  in:
  - go: $t
  - go: $t
  - base: uint
    name: shift
  out:
  - go: $t
- go: ShiftRightConcatMod32
  nameAndSizeCheck: true
  asm: "VPSHRDVD"
  in:
  - go: $t
  - go: $t
  - base: uint
    name: shift
  out:
  - go: $t
- go: ShiftAllLeftConcatMod64
  nameAndSizeCheck: true
  asm: "VPSHLDQ"
  operandOrder: 2I
  in:
  - *pureImm
  - *any
  - *any
  out:
  - *any
- go: ShiftAllRightConcatMod64
  nameAndSizeCheck: true
  asm: "VPSHRDQ"
  operandOrder: 2I
  in:
  - *pureImm
  - *any
  - *any
  out:
  - *any
- go: ShiftLeftConcatMod64
  nameAndSizeCheck: true
  asm: "VPSHLDVQ"
  in:
  - go: $t
  - go: $t
  - base: uint
    name: shift
  out:
  - go: $t
- go: ShiftRightConcatMod64
  nameAndSizeCheck: true
  asm: "VPSHRDVQ"
  in:
  - go: $t
  - go: $t
  - base: uint
    name: shift
  out:
  - go: $t
