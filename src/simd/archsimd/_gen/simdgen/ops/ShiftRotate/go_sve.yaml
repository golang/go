!sum
# ShiftAllLeft — shift every element left by one amount. The amount is a
# scalar in the API, which the lowering broadcasts into the 64-bit lanes of the
# vector LSL (wide elements) shifts each narrower element by. LSL gives 0 for
# an amount of the element width or more, as the API does, so the amount needs
# no clamping. A constant amount below the element width becomes the immediate
# form, shiftAllLeftConst (sftimm).
- go: ShiftAllLeft
  asm: "ZLSL"
  sftimm: true
  in:
  - &int
    go: $t
    base: int|uint
  - &wideShift
    class: vreg
    elemBits: 64
    treatLikeAScalarOfSize: 64
    name: shift
  out:
  - *int

# LSL has no wide form for 64-bit elements; LSL (vectors) takes the amount
# from each element of a vector instead, and gives 0 for 64 or more.
- go: ShiftAllLeft
  asm: "ZLSL"
  sftimm: true
  in:
  - &int64
    go: $t
    base: int|uint
    elemBits: 64
  - *wideShift
  - class: mask # governing predicate
  out:
  - *int64

# shiftAllLeftConst — LSL (immediate, unpredicated), a shift by an amount
# below the element width. No API; sftimm lowers ShiftAllLeft to it.
- go: shiftAllLeftConst
  asm: "ZLSL"
  ssaVariant: "const"
  in:
  - class: immediate
  - *int
  out:
  - *int

# ShiftLeft -- shift each element by the matching element of shift, LSL
# (vectors), which is predicated-only, like Div. An amount of the element
# width or more yields 0, as the API does. For 8- to 32-bit elements the
# machine ops take the variant "vec" to keep them apart from those of LSL
# (wide elements), which ShiftAllLeft uses; for 64-bit elements
# ShiftAllLeft uses this same instruction.
- go: ShiftLeft
  asm: "ZLSL"
  ssaVariant: "vec"
  in:
  - &shiftx
    go: $t
    base: int|uint
    elemBits: 8|16|32
  - &shiftv
    go: $t
    overwriteBase: uint
    name: shift
  - class: mask # governing predicate
  out:
  - *shiftx

- go: ShiftLeft
  asm: "ZLSL"
  in:
  - &shiftx64
    go: $t
    base: int|uint
    elemBits: 64
  - *shiftv
  - class: mask # governing predicate
  out:
  - *shiftx64

# ShiftRight -- LSR for unsigned and ASR for signed elements (vectors), the
# same shape as ShiftLeft. For an amount of the element width or more LSR
# yields 0 and ASR the sign, as the API does. As for ShiftLeft, 8- to 32-bit
# elements take the variant "vec" to keep them apart from the wide-element
# forms ShiftAllRight uses, and 64-bit elements share its op.
- go: ShiftRight
  signed: false
  asm: "ZLSR"
  ssaVariant: "vec"
  in:
  - &shiftxu
    go: $t
    base: uint
    elemBits: 8|16|32
  - *shiftv
  - class: mask # governing predicate
  out:
  - *shiftxu

- go: ShiftRight
  signed: false
  asm: "ZLSR"
  in:
  - &shiftxu64
    go: $t
    base: uint
    elemBits: 64
  - *shiftv
  - class: mask # governing predicate
  out:
  - *shiftxu64

- go: ShiftRight
  signed: true
  asm: "ZASR"
  ssaVariant: "vec"
  in:
  - &shiftxs
    go: $t
    base: int
    elemBits: 8|16|32
  - *shiftv
  - class: mask # governing predicate
  out:
  - *shiftxs

- go: ShiftRight
  signed: true
  asm: "ZASR"
  in:
  - &shiftxs64
    go: $t
    base: int
    elemBits: 64
  - *shiftv
  - class: mask # governing predicate
  out:
  - *shiftxs64
