!sum
# ReduceSum — floating-point add across all lanes (ZFADDV). The sum is a float
# in a floating-point scalar register.
# Predicated-only: the governing predicate is implicit-all-true.
- go: ReduceSum
  asm: "ZFADDV[SD]"
  in:
  - go: $t
    base: float
  - class: mask # governing predicate
  out:
  - &floatScalar
    class: fpreg
    base: float

# ReduceMax — floating-point maximum across all lanes (ZFMAXV), the same shape
# as ReduceSum. FMAXV propagates NaN, as Go's max does.
- go: ReduceMax
  asm: "ZFMAXV[SD]"
  in:
  - go: $t
    base: float
  - class: mask # governing predicate
  out:
  - *floatScalar

# ReduceMin -- floating-point minimum across all lanes (ZFMINV), the same shape
# as ReduceMax. FMINV propagates NaN and orders -0 below +0, as Go's min does.
- go: ReduceMin
  asm: "ZFMINV[SD]"
  in:
  - go: $t
    base: float
  - class: mask # governing predicate
  out:
  - *floatScalar

# ReduceSum (integers) -- add across all lanes (ZUADDVD). UADDV leaves a 64-bit
# sum in a SIMD&FP register, whose low bits are the wrapped sum of the element
# type, signed or not, so the result takes the element's width
# (overwriteElementBits). The lowering moves it to a general register, where Go
# keeps integers.
- go: ReduceSum
  asm: "ZUADDVD"
  in:
  - go: $t
    base: $b
    elemBits: $e
  - class: mask # governing predicate
  out:
  - class: fpreg
    base: $b
    overwriteElementBits: $e

# ReduceMax (integers) -- maximum across all lanes (SMAXV, UMAXV), the same
# shape as the integer ReduceSum, with a result one element wide.
- go: ReduceMax
  asm: "Z[SU]MAXV[BHSD]"
  in:
  - go: $t
    base: int|uint
  - class: mask # governing predicate
  out:
  - class: fpreg
    base: int|uint

# ReduceMin (integers) -- minimum across all lanes (SMINV, UMINV), the same
# shape as the integer ReduceMax.
- go: ReduceMin
  asm: "Z[SU]MINV[BHSD]"
  in:
  - go: $t
    base: int|uint
  - class: mask # governing predicate
  out:
  - class: fpreg
    base: int|uint
